name: CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore backend/racebookApi/racebookApi.csproj

      - name: Build
        run: dotnet build --no-restore backend/racebookApi/racebookApi.csproj

      - name: Check formatting
        run: dotnet format backend/racebookApi/racebookApi.csproj --verify-no-changes --no-restore

      - name: Restore test dependencies
        run: dotnet restore backend/racebookApiTests/racebookApiTests.csproj

      - name: Build tests
        run: dotnet build --no-restore backend/racebookApiTests/racebookApiTests.csproj

      - name: Test
        run: dotnet test --no-build --verbosity normal backend/racebookApiTests/racebookApiTests.csproj

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/racebookFrontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/racebookFrontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npx vitest run

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f backend/racebookApi/Dockerfile -t racebookapiimage:${{ github.sha }} ./backend
